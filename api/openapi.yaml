openapi: 3.1.0
info:
  title: Uptime Monitor API
  version: 0.0.0-dev
  description: |
    Public REST API of Uptime Monitor. Maintained by hand; it describes only
    the endpoints implemented so far.

    Every response carries `X-Request-ID`. Quote it when reporting a problem:
    the same ID is in the server logs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Probes and build information.
  - name: auth
    description: Registration, login and the current user.
  - name: monitors
    description: URLs checked on your behalf. You only ever see your own.

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: The process serves HTTP. Does not check the database.
      operationId: healthz
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                required: [status]

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: The instance can serve requests (PostgreSQL answers within 2 s).
      operationId: readyz
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
              example: { status: ok, checks: { database: ok } }
        "503":
          description: Not ready; take the instance out of the load balancer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
              example: { status: unavailable, checks: { database: unavailable } }

  /version:
    get:
      tags: [system]
      summary: Build information
      operationId: version
      responses:
        "200":
          description: The running build.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: 1.2.0 }
                  commit: { type: string, example: 3f2a9c1d0b4e }
                  built_at: { type: string, example: "2026-10-31T12:00:00Z" }
                required: [version, commit, built_at]

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: |
        The email is trimmed and lowercased. Rate-limited together with
        login: 10 requests per minute per client IP.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in and get an access token
      description: |
        An unknown email and a wrong password both return 401. Rate-limited
        together with register: 10 requests per minute per client IP.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Logged in.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me:
    get:
      tags: [auth]
      summary: The current user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The owner of the token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/monitors:
    post:
      tags: [monitors]
      summary: Create a monitor
      description: |
        Absent fields take their defaults. Fails with 409 when the user
        already has MAX_MONITORS_PER_USER monitors.
      operationId: createMonitor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
            example: { name: Example, url: "https://example.com", interval_seconds: 60 }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the new monitor.
              schema: { type: string, example: /api/v1/monitors/0b8f3c2e-5a1d-4c8e-9f0a-2d6b7e1c4a9f }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/LimitReached" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      tags: [monitors]
      summary: List your monitors
      description: Newest first.
      operationId: listMonitors
      security:
        - bearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Monitor" }
                  total:
                    type: integer
                    description: Number of all your monitors, not just this page.
                required: [items, total]
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/monitors/{id}:
    parameters:
      - { $ref: "#/components/parameters/MonitorID" }
    get:
      tags: [monitors]
      summary: Get one of your monitors
      operationId: getMonitor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [monitors]
      summary: Update a monitor partially
      description: |
        Only the fields present in the body change. `null` clears the
        optional fields `expected_status` and `keyword`; for other fields it
        is a validation error. Set `is_active` to pause or resume. A resumed
        monitor or one with a new URL is checked as soon as possible.
      operationId: updateMonitor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
            example: { is_active: false, keyword: null }
      responses:
        "200":
          description: The updated monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [monitors]
      summary: Delete a monitor
      operationId: deleteMonitor
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/monitors/{id}/checks:
    parameters:
      - { $ref: "#/components/parameters/MonitorID" }
    get:
      tags: [monitors]
      summary: Check history of a monitor
      description: |
        Checks with `from <= checked_at < to`, newest first. Without
        from/to: the last 24 hours. Checks older than CHECKS_RETENTION_DAYS
        (30) are deleted.
      operationId: listChecks
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Start of the range, RFC 3339. Default to - 24h.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the range (exclusive), RFC 3339. Default now.
          schema: { type: string, format: date-time }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of checks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Check" }
                  total: { type: integer, description: Checks in the range. }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                required: [items, total, from, to]
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/monitors/{id}/stats:
    parameters:
      - { $ref: "#/components/parameters/MonitorID" }
    get:
      tags: [monitors]
      summary: Uptime and latency statistics of a monitor
      description: |
        Computed by PostgreSQL over the period ending now. Uptime counts all
        checks; latency figures cover successful checks only. Figures are
        null when there is nothing to aggregate.
      operationId: monitorStats
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        "200":
          description: Statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
              example:
                period: 7d
                from: "2026-10-24T12:00:00Z"
                total_checks: 20160
                failed_checks: 3
                uptime_percent: 99.985
                avg_response_ms: 431.2
                p95_response_ms: 610
                p95_ttfb_ms: 140
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  parameters:
    MonitorID:
      name: id
      in: path
      required: true
      description: |
        Monitor ID. Unknown, malformed and other users' IDs all answer 404.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
      required: [status, checks]

    Credentials:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: alice@example.com
        password:
          type: string
          minLength: 8
          description: At least 8 characters and at most 72 bytes (the bcrypt limit).
          example: correct-horse
      required: [email, password]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
      required: [id, email, created_at]

    Token:
      type: object
      properties:
        access_token:
          type: string
          description: "JWT; send it as `Authorization: Bearer <token>`."
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
      required: [access_token, token_type, expires_at]

    MonitorInput:
      type: object
      additionalProperties: false
      description: |
        Body of create and update. On create, `name` and `url` are required
        and other absent fields take the defaults shown.
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed. }
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            http or https, no user:password, and not an internal address
            (loopback, private, link-local, CGNAT, localhost, numeric hosts)
            unless the server runs with ALLOW_PRIVATE_TARGETS=true.
        method: { type: string, enum: [GET, HEAD], default: GET, description: Case-insensitive. }
        interval_seconds: { type: integer, minimum: 30, maximum: 86400, default: 60 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 30, default: 10 }
        expected_status:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
          default: null
          description: null accepts any 2xx.
        keyword:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
          default: null
          description: Substring the first 1 MiB of the body must contain; null disables the check.
        follow_redirects: { type: boolean, default: true, description: At most 5 redirects. }
        failure_threshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Failed checks in a row before an incident opens.
        cert_expiry_warn_days:
          type: integer
          minimum: 1
          maximum: 90
          default: 14
          description: Warn this many days before the TLS certificate expires.
        is_active: { type: boolean, default: true, description: false pauses the monitor. }

    Monitor:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, HEAD] }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        expected_status: { type: [integer, "null"] }
        keyword: { type: [string, "null"] }
        follow_redirects: { type: boolean }
        failure_threshold: { type: integer }
        cert_expiry_warn_days: { type: integer }
        is_active: { type: boolean }
        status:
          type: string
          enum: [unknown, up, down]
          description: unknown until the first check.
        tls_not_after:
          type: [string, "null"]
          format: date-time
          description: Expiry of the last seen TLS certificate.
        last_checked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, url, method, interval_seconds, timeout_seconds, expected_status,
        keyword, follow_redirects, failure_threshold, cert_expiry_warn_days, is_active,
        status, tls_not_after, last_checked_at, created_at, updated_at]

    Check:
      type: object
      description: |
        One check. Timings describe the final request after redirects and are
        null when the phase did not happen (no DNS for an IP literal, no TLS
        for http://, nothing after a failed connect).
      properties:
        id: { type: integer, format: int64 }
        checked_at: { type: string, format: date-time }
        success: { type: boolean }
        status_code: { type: [integer, "null"] }
        response_time_ms:
          type: integer
          description: Whole check, including redirects and reading up to 1 MiB of body.
        dns_ms: { type: [integer, "null"] }
        connect_ms: { type: [integer, "null"] }
        tls_ms: { type: [integer, "null"] }
        ttfb_ms:
          type: [integer, "null"]
          description: From the request being written to the first response byte.
        http_proto: { type: [string, "null"], example: HTTP/2.0 }
        tls_version: { type: [string, "null"], example: TLS1.3 }
        tls_not_after:
          type: [string, "null"]
          format: date-time
          description: Expiry of the server's leaf certificate.
        error_kind:
          type: [string, "null"]
          enum: [dns, timeout, connection, tls, unexpected_status, keyword_mismatch, blocked_target, unknown, null]
        error_message: { type: [string, "null"] }
      required: [id, checked_at, success, status_code, response_time_ms, dns_ms, connect_ms,
        tls_ms, ttfb_ms, http_proto, tls_version, tls_not_after, error_kind, error_message]

    Stats:
      type: object
      properties:
        period: { type: string, enum: [24h, 7d, 30d] }
        from: { type: string, format: date-time }
        total_checks: { type: integer }
        failed_checks: { type: integer }
        uptime_percent: { type: [number, "null"] }
        avg_response_ms: { type: [number, "null"] }
        p95_response_ms: { type: [number, "null"] }
        p95_ttfb_ms: { type: [number, "null"] }
      required: [period, from, total_checks, failed_checks, uptime_percent,
        avg_response_ms, p95_response_ms, p95_ttfb_ms]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [validation_failed, unauthorized, not_found, conflict, rate_limited, internal]
            message: { type: string }
            details:
              type: array
              description: Present for validation_failed only.
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: JSON field name, or "body" for the request as a whole.
                  issue: { type: string }
                required: [field, issue]
          required: [code, message]
      required: [error]

  responses:
    ValidationFailed:
      description: |
        Invalid input: malformed JSON, unknown fields, wrong types, rule
        violations, or a body over 1 MiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: Invalid request
              details:
                - { field: password, issue: must be at least 8 characters }
    Unauthorized:
      description: Missing, invalid or expired credentials.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer realm="uptime-monitor"' }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: Authentication required } }
    NotFound:
      description: No such monitor of yours.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Resource not found } }
    LimitReached:
      description: You already have the maximum number of monitors.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: Limit reached } }
    Conflict:
      description: The email is already registered.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: Resource already exists } }
    RateLimited:
      description: Too many requests from this IP.
      headers:
        Retry-After:
          description: Seconds until the next request is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: Too many requests } }
    Internal:
      description: Unexpected server error. Details are only in the server log.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: internal, message: Internal server error } }
